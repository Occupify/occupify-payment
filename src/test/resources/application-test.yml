spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    listener:
      simple:
        auto-startup: false

app:
  rabbitmq:
    user-exchange: occupify.user.exchange
    user-queue: occupify.payment.user.queue
    user-activated-routing-key: user.activated
    contract-exchange: occupify.contract.exchange
    contract-queue: occupify.payment.contract.queue
    contract-accepted-routing-key: contract.accepted
    contract-rejected-routing-key: contract.rejected
    contract-compensation-routing-key: contract.compensation.#
    dlx-exchange: occupify.payment.dlx
    dlq-queue: occupify.payment.user.dlq
    dlq-routing-key: user.dlq
