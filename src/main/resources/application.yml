server:
  port: ${SERVER_PORT:8183}

spring:
  application:
    name: occupify-payment
  config:
    import: optional:file:payment.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5532/occupify_payment}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

app:
  rabbitmq:
    user-exchange: ${RABBITMQ_USER_EXCHANGE:occupify.user.exchange}
    user-queue: ${RABBITMQ_USER_QUEUE:occupify.payment.user.queue}
    user-activated-routing-key: ${RABBITMQ_USER_ACTIVATED_ROUTING_KEY:user.activated}
    contract-exchange: ${RABBITMQ_CONTRACT_EXCHANGE:occupify.contract.exchange}
    contract-queue: ${RABBITMQ_CONTRACT_QUEUE:occupify.payment.contract.queue}
    contract-accepted-routing-key: ${RABBITMQ_CONTRACT_ACCEPTED_ROUTING_KEY:contract.accepted}
    contract-rejected-routing-key: ${RABBITMQ_CONTRACT_REJECTED_ROUTING_KEY:contract.rejected}
    contract-compensation-routing-key: ${RABBITMQ_CONTRACT_COMPENSATION_ROUTING_KEY:contract.compensation.#}
    dlx-exchange: ${RABBITMQ_DLX_EXCHANGE:occupify.payment.dlx}
    dlq-queue: ${RABBITMQ_USER_DLQ:occupify.payment.user.dlq}
    dlq-routing-key: ${RABBITMQ_USER_DLQ_ROUTING_KEY:user.dlq}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
