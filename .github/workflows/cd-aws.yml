name: Occupify Payment CD flow (AWS)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: be-deploy-payment-aws
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/occupify-payment
  GITOPS_REPO: Occupify/occupify-gitops
  AWS_REGION: ap-southeast-1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-push-ghcr:
    name: Build and Push Docker Image to GHCR
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven

      - name: Grant execute permission for mvnw
        run: |
          sed -i 's/\r$//' mvnw
          chmod +x mvnw

      - name: Build JAR with Maven
        run: ./mvnw clean package -DskipTests -B

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Format image name to lowercase
        run: |
          echo "IMAGE_NAME_LOWER=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}:latest-aws
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}:latest

  deploy:
    name: Deploy Payment Service (AWS)
    needs: build-and-push-ghcr
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via Bastion SSH and GitOps
        env:
          BASTION_KEY: ${{ secrets.BASTION_SSH_KEY }}
          BASTION_HOST: ${{ secrets.BASTION_HOST }}
          SERVICE_NAME: payment
          AWS_REGION: ap-southeast-1
        run: |
          mkdir -p ~/.ssh
          echo "$BASTION_KEY" > ~/.ssh/bastion.pem
          chmod 600 ~/.ssh/bastion.pem

          ssh -i ~/.ssh/bastion.pem -o StrictHostKeyChecking=accept-new ubuntu@$BASTION_HOST "ssh -o StrictHostKeyChecking=accept-new $SERVICE_NAME '
            # 1. Fetch secret payload from AWS Secrets Manager
            mkdir -p ~/gitops/env
            aws secretsmanager get-secret-value \
              --secret-id occupify/prod/$SERVICE_NAME \
              --region ${{ env.AWS_REGION }} \
              --query SecretString \
              --output text > ~/gitops/env/$SERVICE_NAME.env

            # 2. Execute GitOps Makefile target
            export DOCKER_HOST=unix:///run/podman/podman.sock
            cd ~/gitops && make $SERVICE_NAME

            # 3. Health verification on host port 8080
            for i in {1..30}; do
              if curl -sI http://127.0.0.1:8080 >/dev/null 2>&1; then
                echo \"$SERVICE_NAME is UP and responding on port 8080\"
                break
              fi
              sleep 2
            done
            curl -I http://127.0.0.1:8080 || true
          '"
          shred -u ~/.ssh/bastion.pem
